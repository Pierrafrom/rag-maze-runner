[project]
name = "rag-maze-runner"
version = "0.1.0"
description = "RAG question-réponse en français sur l'univers du Labyrinthe (Maze Runner) — LO17/AI31 UTC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "flashrank>=0.2.10",
    "langchain-groq>=1.1.3",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "types-requests>=2.31",
    "types-beautifulsoup4>=4.12",
]

# ---------------------------------------------------------------------------
# Mypy — vérification de types stricte sur le code source
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
show_error_codes = true
show_column_numbers = true

# Bibliothèques tierces sans stubs complets ni marqueur py.typed.
# On les ignore entièrement pour mypy ; nos propres usages restent typés.
[[tool.mypy.overrides]]
module = [
    "langchain_classic.*",
    "langchain_community.*",
    "flashrank.*",
    "langchain_groq.*",
    "langchain_huggingface.*",
]
ignore_missing_imports = true

# Tests : on garde strict mais on tolère les Any issus des mocks pytest
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true
warn_return_any = false

# ---------------------------------------------------------------------------
# Ruff — lint + format (remplace flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle (style)
    "F",            # pyflakes (erreurs courantes)
    "I",            # isort (ordre des imports)
    "B",            # flake8-bugbear (pièges courants)
    "C4",           # flake8-comprehensions (list/dict/set plus idiomatiques)
    "UP",           # pyupgrade (modernisation syntaxe Python 3.11)
    "SIM",          # flake8-simplify (simplifications évidentes)
    "TCH",          # flake8-type-checking (imports TYPE_CHECKING)
    "RUF",          # règles spécifiques Ruff
    "PLC", "PLE", "PLW",  # pylint (conventions, erreurs, warnings)
    "LOG",          # flake8-logging (appels logger corrects)
    "G",            # flake8-logging-format (pas de % dans logger.*, utiliser les args)
    "N",            # pep8-naming (nommage conforme PEP 8)
]
ignore = [
    "PLR0913",  # trop d'arguments dans une fonction — inévitable avec LangChain
    "PLR2004",  # valeurs magiques : OK pour les seuils de config
    "B008",     # appels dans les valeurs par défaut — pattern courant (lazy init)
    "N999",     # module name — on a des noms avec accents dans les prompts
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004",  # valeurs magiques OK dans les assertions de test
    "S101",     # assert OK dans pytest
]
"ingest.py" = ["T20"]          # print() autorisé dans le script d'ingestion CLI
"src/loader.py" = ["E402"]     # os.environ.setdefault doit précéder les imports text-splitters

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest — configuration des tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v --strict-markers"
markers = [
    "unit: tests unitaires purs (pas d'appel API, pas d'index Chroma requis)",
    "integration: tests d'intégration (requièrent GOOGLE_API_KEY + index construit)",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "ingest.py", "main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
